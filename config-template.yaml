ProjectName: 'TestProject'  # 项目名称

# 服务器配置
ServerConfig:
  host: '0.0.0.0'  # 主机
  port: 7878  # 端口
  workers: 1  # 进程数
  log_dir: 'logs'  # 日志目录路径
  file_max_size: 3145728  # 文件最大上传大小（字节）
  token_expire: 604800  # Token有效期（秒），用户登录有效期
  secret_key: "93b0da7c01a615a5ec93d1ce0048e440"  # Token密钥
  captcha_expire: 300  # 验证码有效期（秒）

  # 跨域配置
  CORSConfig:
    allow_origins: ['*']
    allow_methods: ['*']
    allow_headers: ['*']

# ARQ后台任务配置
WorkerConfig:
  queue_name: 'arq:queue:fastapi-template'  # Redis任务队列名称
  max_jobs: 5  # 单个ARQ worker最大并发任务数
  job_timeout: 10  # 单个任务超时时间（秒）
  max_tries: 3  # 单个任务最大执行次数
  retry_delay: 2  # 任务失败后的重试延迟（秒）
  job_expires: 60  # 排队任务过期时间（秒）
  enqueue_timeout: 0.5  # Web进程入队超时时间（秒）
  shutdown_timeout: 10  # Worker优雅关闭等待时间（秒）

# 邮箱配置
EmailConfig:
  email_from: 'xxx@163.com'  # 发件邮箱
  email_password: 'XXX'  # 邮箱密码/SMTP授权码

# 数据库配置
DatabaseConfig:
  # Mysql配置
  MysqlConfig:
    host: '127.0.0.1'  # 主机
    port: 3306  # 端口
    database_name: 'test_project'  # 数据库名称
    username: 'root'  # 用户名
    password: 'root'  # 密码
    auto_create_table: false  # 是否自动创建表

  # Redis配置
  RedisConfig:
    host: '127.0.0.1'  # 主机
    port: 6379  # 端口
    password: '' # 密码
    db: 6  # 数据库
